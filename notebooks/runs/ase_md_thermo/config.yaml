simulator:
  engine:
    _target_: curator.simulate.engines.ase_md.MDEngine
    dynamics_cls: ase.md.langevin.Langevin
    timestep: 0.5
    friction: 0.2
    temperature_K: 300
  callbacks:
  - _target_: curator.simulate.callbacks.calc.CalculatorAssign
    calculator: ${model_path}
    warmup: true
    require_forces: false
    apply_to_neb_images: false
    device: ${device}
  - _target_: curator.simulate.callbacks.thermo_uncertainty.ThermoWithUncertainty
    variables: basic_energies
    interval: 5
    header: true
    monitor: maha_dist
    low: null
    high: null
    uncertainty_backend:
      _target_: curator.simulate.uncertainty.auto.AutoUncertainty
      calculator: ${model_path}
      dataset: ${dataset}
      device: ${device}
  - _target_: curator.simulate.callbacks.trajectory.TrajectoryWriter
    path: ${run_path}/trajectory_sys{i}.traj
    interval: 1
    per_system: true
  - _target_: curator.simulate.callbacks.early_stop.EarlyStop
  _target_: curator.simulate.core.simulator.Simulator
  init_traj: ../test/LiFePO4.traj
  start_index: null
  run_kwargs:
    steps: 100
cfg: null
seed: 1234
run_path: ./runs/ase_md_thermo
model_path: ../test/best_model.ckpt
dataset: null
device: cuda
deploy: null
calculator: ${model_path}
