simulator:
  calculator:
    _target_: curator.simulate.calculator.MLCalculator
    _partial_: true
    transforms: []
    energy_scale: 1.0
    forces_scale: 1.0
  logger:
    _target_: curator.simulate.logger.MDLogger
    logger: null
    uncertainty: null
    min_calls: 1000
  dynamics:
    _target_: ase.md.Langevin
    _partial_: true
    timestep: '${multiply_fs: ${simulator.timestep}}'
    temperature_K: ${simulator.temperature}
    friction: '${divide_by_fs: 0.01}'
  uncertainty:
    _target_: curator.simulate.uncertainty.EnsembleUncertainty
    key: force_sd
    high_threshold: 0.5
    low_threshold: 0.05
    save_uncertain_atoms: ${run_path}/warning_struct.traj
    max_uncertain_calls: 1000
  _target_: curator.simulate.simulator.MDSimulator
  init_traj: null
  out_traj: ${run_path}/MD.traj
  start_index: -1
  rattle: false
  fix_under: null
  print_step: 1
  dump_step: 100
  max_steps: 1000
  initialize_velocities: true
  temperature: 298.15
  timestep: 0.5
cfg: config.yaml
seed: 1234
run_path: .
model_path: null
device: cuda
deploy: null
