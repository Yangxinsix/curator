defaults:
  - model: qeq
  - data: custom
  - task: default_task
  - trainer: default_trainer
  - task/outputs: energy_force_residual
  - _self_

cfg: qeq.yaml
run_path: .
device: cuda
deploy_model: false

model:
  representation:
    cutoff: 5.0

trainer:
  accelerator: cuda
  devices: 1
  max_epochs: 3
  # limit_train_batches: 1
  # limit_val_batches: 1
  # num_sanity_val_steps: 0

data:
  datapath: ../LiFePO4.traj
  batch_size: 16
  val_batch_size: 8
  compute_neighbor_list: false
  cutoff: 13.2
  # num_train: 0.9
  # num_val: 0.1
  # num_test: 0
  # val_only: false
  transforms:
    - _target_: curator.data.MatScipyNeighborList
      cutoff: ${data.cutoff}
      requires_grad: false
      return_distance: false
      return_cell_displacements: true

task:
  loss_weights:
    chemical_potential_residual: 1.0
