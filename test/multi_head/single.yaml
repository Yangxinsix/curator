data:
  datapath: /home/xinyang/curator/example/dataset_1593.traj
  pin_memory: false
model:
  representation:
    readout:
      _target_: curator.layer.MultiDomainAtomwiseNN
      _partial_: true
  output_modules:
    global_rescale_shift:
      _target_: curator.layer._rescale.MultiDomainRescaleShift
trainer:
  accelerator: cpu
  devices: 1
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 2
  num_sanity_val_steps: 0
  callbacks:
    early_stopping:
      monitor: val_total_loss
    model_checkpoint:
      monitor: val_total_loss
task:
  scheduler_monitor: val_total_loss
run_path: test/multi_head/single_run
deploy_model: false
