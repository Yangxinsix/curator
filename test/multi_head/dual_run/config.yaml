trainer:
  _target_: pytorch_lightning.Trainer
  devices: 1
  default_root_dir: ${run_path}
  min_epochs: null
  max_epochs: 100
  enable_model_summary: true
  profiler: null
  log_every_n_steps: 10
  gradient_clip_val: 10.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  fast_dev_run: false
  overfit_batches: 0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  detect_anomaly: false
  precision: 32
  accelerator: cuda
  num_nodes: 1
  deterministic: false
  inference_mode: false
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${run_path}/logs
    name: curator-train
  callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${run_path}/model_path
    save_top_k: 1
    monitor: val_total_loss/dataloader_idx_0
    filename: best_model_{epoch}_{step}_{val_total_loss:.2f}
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_total_loss/dataloader_idx_0
    min_delta: 0.0
    patience: ${task.patience}
    mode: min
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: epoch
  - _target_: curator.train.ExponentialMovingAverage
    decay: 0.995
    use_num_updates: true
task:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0005
    eps: 1.0e-08
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.01
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    factor: 0.5
    patience: 50
  outputs:
  - _target_: curator.train.ModelOutput
    name: energy
    loss_fn:
      _target_: torch.nn.MSELoss
    loss_weight: ${task.energy_weight}
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
  - _target_: curator.train.ModelOutput
    name: forces
    loss_fn:
      _target_: torch.nn.MSELoss
    loss_weight: ${task.forces_weight}
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
  _target_: curator.model.LitNNP
  scheduler_monitor: val_total_loss/dataloader_idx_0
  warmup_steps: 0
  save_entire_model: true
  load_entire_model: false
  load_weights_only: true
  energy_weight: 1
  forces_weight: 100
  patience: 200
  normalize_domain_loss: true
model:
  _convert_: all
  _target_: curator.model.NeuralNetworkPotential
  heads:
    _target_: curator.data.properties.HeadConfigFactory
    heads:
    - energy
  representation:
    _target_: curator.model.Painn
    num_interactions: 3
    num_features: 128
    cutoff: 5.0
    num_basis: 20
    cutoff_fn:
      _target_: curator.layer.CosineCutoff
      cutoff: ${..cutoff}
    radial_basis:
      _target_: curator.layer.SineBasis
      cutoff: ${..cutoff}
      num_basis: ${model.representation.num_basis}
    heads: ${model.heads}
    readout:
      _target_: curator.layer.MultiDomainAtomwiseNN
      _partial_: true
  input_modules:
  - _target_: curator.layer.PairwiseDistance
    compute_neighbor_list: true
    compute_distance_from_R: false
    cutoff: ${data.cutoff}
  output_modules:
  - _target_: curator.layer.GradientOutput
  - _target_: curator.layer._rescale.MultiDomainRescaleShift
    heads: ${model.heads}
data:
  _target_: curator.data.datamodule.DataModuleFactory
  _convert_: partial
  datapath:
    water:
      datapath: /home/xinyang/curator/example/dataset_1593.traj
      heads:
      - energy
    lifp:
      datapath: /home/xinyang/curator/example/LiFePO4.traj
      heads:
      - energy
  train_path: null
  val_path: null
  test_path: null
  batch_size: 16
  compute_neighbor_list: false
  cutoff: 5.0
  num_train: 0.9
  num_val: 0.1
  num_test: null
  train_val_split: random
  shuffle: true
  num_workers: 0
  pin_memory: false
  species: null
  avg_num_neighbors: null
  atomic_energies: null
  normalization: true
  atomwise_normalization: true
  scale_forces: true
  transforms: []
seed: 3407
cfg: dual.yaml
model_path: null
run_path: .
deploy_model: false
compile: false
device: cuda
