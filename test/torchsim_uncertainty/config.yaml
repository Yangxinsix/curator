simulator:
  engine:
    _target_: curator.simulate.engines.torchsim.TorchSimEngine
    dynamics_cls: ase.md.langevin.Langevin
    timestep: 0.001
    friction: 0.2
    temperature_K: 300
    integrator: nve
    temperature: 300.0
    model:
      _target_: curator.interface.torchsim.CuratorTorchSimAdapter
      model: /home/xinyang/curator/test/best_model.ckpt
      cutoff: null
      compute_neighbor_list: true
      transforms: null
      device: cpu
      load_compiled: false
      load_weights_only: false
      return_cell_displacements: false
      outputs: null
      energy_scale: 1.0
      forces_scale: 1.0
      stress_scale: 1.0
      detach: true
  _target_: curator.simulate.core.simulator.Simulator
  init_traj: /home/xinyang/curator/test/LiFePO4.traj
  start_index:
  - 0
  - 1
  run_kwargs:
    steps: 2
  callbacks:
  - _target_: curator.simulate.callbacks.torchsim_logger.TorchSimThermoLogger
    variables: basic_energies
    interval: 1
    header: true
    per_system_logs: true
    log_dir: /home/xinyang/curator/test/torchsim_uncertainty
    monitor: maha_dist
    low: null
    high: null
    uncertainty_backend:
      _target_: curator.simulate.uncertainty.auto.AutoUncertainty
      calculator: /home/xinyang/curator/test/best_model.ckpt
      dataset: /home/xinyang/curator/test/torchsim_uncertainty/dataset_small.traj
      device: cpu
      maha_kwargs:
        kernel: local-full-g
        max_structures: 8
  - _target_: curator.simulate.callbacks.torchsim_logger.TorchSimTrajectoryWriter
    path: /home/xinyang/curator/test/torchsim_uncertainty/frames_sys{i}.traj
    interval: 1
    per_system: true
  - _target_: curator.simulate.callbacks.early_stop.EarlyStop
cfg: config.yaml
seed: 1234
run_path: /home/xinyang/curator/test/torchsim_uncertainty
model_path: /home/xinyang/curator/test/best_model.ckpt
dataset: null
device: cpu
deploy: null
calculator: /home/xinyang/curator/test/best_model.ckpt
