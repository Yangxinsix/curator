simulator:
  engine:
    _target_: curator.simulate.engines.ase_md.MDEngine
    dynamics_cls: ase.md.verlet.VelocityVerlet
    timestep: 0.5
    friction: 0.2
    temperature_K: 300
  _target_: curator.simulate.core.simulator.Simulator
  init_traj: /home/xinyang/curator/test/LiFePO4.traj
  start_index: 0
  run_kwargs:
    steps: 2
  callbacks:
  - _target_: curator.simulate.callbacks.calc.CalculatorAssign
    calculator:
      _target_: curator.simulate.core.calculator.MLCalculator
      model: /home/xinyang/curator/test/best_model.ckpt
      device: cpu
  - _target_: curator.simulate.callbacks.thermo_uncertainty.ThermoWithUncertainty
    interval: 1
    variables: basic_energies
    monitor: maha_dist
    low: null
    high: null
    uncertainty_backend:
      _target_: curator.simulate.uncertainty.auto.AutoUncertainty
      calculator: /home/xinyang/curator/test/best_model.ckpt
      dataset: /home/xinyang/curator/test/torchsim_uncertainty/dataset_small.traj
      device: cpu
  - _target_: curator.simulate.callbacks.trajectory.TrajectoryWriter
    path: /home/xinyang/curator/test/ase_md_uncertainty/MD.traj
    interval: 1
  - _target_: curator.simulate.callbacks.early_stop.EarlyStop
cfg: test/ase_md_uncertainty/config.yaml
seed: 1234
run_path: /home/xinyang/curator/test/ase_md_uncertainty
model_path: /home/xinyang/curator/test/best_model.ckpt
dataset: null
device: cpu
deploy: null
calculator: /home/xinyang/curator/test/best_model.ckpt
