simulator:
  engine:
    _target_: curator.simulate.engines.ase_md.MDEngine
    dynamics_cls: ase.md.langevin.Langevin
    timestep: 0.5
    friction: 0.2
    temperature_K: 300
  callbacks:
  - _target_: curator.simulate.callbacks.calc.CalculatorAssign
    calculator:
      _target_: ase.calculators.plumed.Plumed
      _partial_: true
      calc:
        _target_: curator.simulate.core.calculator.MLCalculator
        model: ${model_path}
        device: ${device}
      input: null
      timestep: ${simulator.engine.timestep}
      kT: ${simulator.engine.temperature_K}
    warmup: true
    require_forces: false
    apply_to_neb_images: false
    device: ${device}
  - _target_: curator.simulate.callbacks.thermo_uncertainty.ThermoWithUncertainty
    variables: basic_energies
    interval: 1
    header: true
    monitor: maha_dist
    low: null
    high: null
    uncertainty_backend:
      _target_: curator.simulate.uncertainty.auto.AutoUncertainty
      calculator: ${model_path}
      dataset: ${dataset}
      device: ${device}
  - _target_: curator.simulate.callbacks.trajectory.TrajectoryWriter
    path: ${run_path}/trajectory_sys{i}.traj
    interval: 1
    per_system: true
  - _target_: curator.simulate.callbacks.early_stop.EarlyStop
  _target_: curator.simulate.core.simulator.Simulator
  init_traj: /home/xinyang/curator/test/LiFePO4.traj
  start_index: null
  run_kwargs:
    steps: 1000
cfg: /home/xinyang/curator/test/ase_md_defaults/config.yaml
seed: 1234
run_path: /home/xinyang/curator/test/ase_md_defaults
model_path: /home/xinyang/curator/test/best_model.ckpt
dataset: /home/xinyang/curator/test/torchsim_uncertainty/dataset_small.traj
device: cpu
deploy: null
calculator: ${model_path}
