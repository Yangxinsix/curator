name: Build and publish CURATOR

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the built distributions to TestPyPI
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wheels:
    name: Wheel · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - name: windows-amd64
            runner: windows-latest
            arch: AMD64
          - name: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            runner: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - name: Store wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build source distribution
        run: pipx run build --sdist

      - name: Check source distribution metadata
        run: pipx run twine check dist/*.tar.gz

      - name: Store source distribution
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/curator-torch/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/curator-torch/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
