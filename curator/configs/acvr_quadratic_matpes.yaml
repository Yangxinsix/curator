# Both couplings load separately prepared Curator MATPES+quadratic checkpoints.
# Supply model_path; never silently initialize a tiny random backbone.
seed: 3407
cfg: null
run_path: runs/acvr_quadratic_matpes
model_path: ???
device: cuda
compile: false
deploy_model: false
finetune: full
model: {}
data:
  _target_: curator.data.acvr_ef.ACVREFDataModule
  datapath: ???
  manifest_dir: ${run_path}/data
  split_file: null
  seed: 3407
  num_train: 270
  num_val: 30
  batch_size: 12
  val_batch_size: 6
  num_workers: 0
  default_dtype: float32
  total_charge: 0.0
  heads: [energy, forces]
task:
  _target_: curator.model.LitNNP
  outputs:
  - _target_: curator.train.VariationalModelOutput
    loss_fn:
      _target_: curator.train.VariationalJointLoss
      supervised_weights: {condition_energy: 200.0, condition_forces: 200.0}
      supervised_scales: {condition_energy: 1.0, condition_forces: 1.0}
      required_labels: [condition_energy, condition_forces]
      energy_per_atom: true
      residual_weights: {stationarity: 1.0}
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0001
    amsgrad: true
  scheduler: null
  save_entire_model: true
  normalize_domain_loss: false
trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: 1
  precision: 32-true
  max_epochs: 10
  inference_mode: false
  deterministic: true
  gradient_clip_val: 10.0
  accumulate_grad_batches: 1
  enable_model_summary: false
  enable_progress_bar: false
  num_sanity_val_steps: -1
  log_every_n_steps: 1
  default_root_dir: ${run_path}
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${run_path}
    name: metrics
  callbacks:
  - _target_: curator.train.acvr_monitor.ACVRPhysicalMonitor
    output_path: ${run_path}/physical_metrics.jsonl
  - _target_: curator.train.joint_callbacks.JointValidationLoss
  - _target_: curator.train.joint_callbacks.JointModelCheckpoint
    dirpath: ${run_path}/model_path
    filename: best_model_{epoch}_{step}_{val_joint_predicted_loss:.8f}
    monitor: val_joint_predicted_loss
    mode: min
    save_top_k: 1
    save_last: true
    every_n_epochs: 1
    save_on_train_epoch_end: true
hydra:
  run:
    dir: ${run_path}/hydra
