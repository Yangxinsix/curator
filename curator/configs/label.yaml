defaults:
  - annotator: vasp_annotator                                   # calculator/annotator backend
  - optional annotator/calc_params: ${annotator/calculator}_params  # calculator-specific overrides
  - _self_

cfg: null                                                        # optional config file to merge
run_path: .                                                      # working directory for outputs
datapath: null                                                   # dataset containing structures to label
pool_set: null                                                   # dataset or list serving as unlabeled pool
indices: null                                                    # subset indices within pool_set to label
al_info: null                                                    # active learning metadata from previous run

# split labeling jobs to multiple job, only one of imgs_per_job or split_jobs need to be set
split_jobs: null                                                 # number of label chunks to create
imgs_per_job: null                                               # fixed number of images per chunk
job_order: null                                                  # which split chunks to execute
