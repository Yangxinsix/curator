defaults:
  - _self_
  - logger: csv
  - /trainer/callbacks@callbacks.model_checkpoint: model_checkpoint
  - /trainer/callbacks@callbacks.early_stopping: early_stopping
  - /trainer/callbacks@callbacks.learning_rate_monitor: learning_rate_monitor
  - /trainer/callbacks@callbacks.ema: ema

_target_: pytorch_lightning.Trainer

devices: 1

default_root_dir: ${run_path}
min_epochs: null
max_epochs: 1000

# prints
enable_model_summary: True
profiler: null

log_every_n_steps: 10
gradient_clip_val: 10.0
gradient_clip_algorithm: norm
accumulate_grad_batches: 1
val_check_interval: 1.0
check_val_every_n_epoch: 1

num_sanity_val_steps: -1
fast_dev_run: False
overfit_batches: 0
limit_train_batches: 1.0
limit_val_batches: 1.0
limit_test_batches: 1.0
detect_anomaly: False

precision: 32
accelerator: auto
num_nodes: 1
deterministic: False
inference_mode: False