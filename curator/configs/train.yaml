
defaults:
  - trainer: default_trainer       # training loop and callbacks used by PyTorch Lightning
  - task: default_task             # task-specific model wrapper (losses, optimizer, scheduler)
  - model: nnp                     # base model architecture to train
  - data: custom                   # dataset and dataloader settings
  - optional model/repr_params: ${model/representation}_params  # representation-specific hyperparameters (batch size, optimizer, lr, etc.)
  - optional task/output_params: ${task/outputs}_params         # task output-specific overrides
  - optional finetune: null        # optional fine-tuning mode, e.g. `finetune=multi_domain`
  - optional addon: null           # optional runtime wrapper/addon stack, e.g. `addon=elora`
  - _self_

# Some parameters that are important for training
seed: 3407                         # random seed for reproducibility
cfg: null                          # optional path to an existing config to merge
model_path: null                   # path to start from a pre-trained checkpoint
run_path: .                        # root directory for logs, checkpoints, and artifacts
deploy_model: True                 # export a deployable model after training
deploy:
  uncertainty: null                # optional deploy-time uncertainty spec; keep method extensions under curator.simulate.uncertainty
                                   # structure:
                                   #   method: none | ensemble | mahalanobis
                                   #   dataset: null
                                   #   output_keys: null
                                   #   maha:
                                   #     kernel: local-full-g
                                   #     max_structures: null
                                   #     regularization: 1e-6
                                   #     streaming: false
compile: False                     # torch.compile model before training if supported
device: cuda                       # device identifier for training
