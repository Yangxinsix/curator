_convert_: all
cfg: null
seed: 123
run_path: .
model_path: null # Examples: matgl:MEGNet-MP-2018.6.1-Eform?backend=PYG | allegro:/path/model.nequip.zip?target_layer=edge_readout | esen:uma-s-omol?task=omol
device: cuda
train_set: null
pool_set: null
data_url: null # URL string; use pool_set for local paths
data_batch_size: 8
select_batch_size: 100
method: lcmd_greedy
selection_kwargs: {}
# For max_det_greedy only: selection_kwargs: {regularization: 1.0e-6}
# The ridge is relative to the pool's mean kernel diagonal and ensures an equal
# selection budget even for low-rank features; zero requests unregularized mode.
selection_feature: null # Use the first feature spec's versioned output name.
feature_specs:
  - preset: fg-sketch
    seed: ${seed}

# Ablation examples:
# - Gaussian sketch full-gradient with per-layer RMS norm:
#   preset: fg-sketch-rms
#   seed: ${seed}
#
# - Gaussian RFF of the complete selected readout parameter gradient:
#   preset: fg-rff
#   rff_kernel: rbf  # Joint readout RFF uses one isotropic Gaussian kernel.
#   sigma: 1.0
#   seed: ${seed}
#
# - Frozen Gaussian Nyström KME of the same selected readout gradient:
#   feature_specs:
#     - preset: fg-nystrom  # Also gnn-nystrom, llg-nystrom, local_fg-nystrom.
#       nystrom_state: /path/to/prepared_readout_nystrom.pt
#       num_features: 512  # Must match the saved map's requested output width.
#       sigma: 1.0        # Must match the saved map; no recalibration at selection.
#   export_normalized_features: false  # Preserve the Gaussian KME distance.
#   # Use the same model, target_layer, num_layers, and frozen state for pool/train.
#   # The CLI currently accepts one model for Nyström; prepare one map per model.
#
# - Other stationary kernels on a simple GNN feature:
#   preset: gnn-rff
#   rff_kernel: matern32  # rbf, matern32, matern52, or laplacian_l1
#   sigma: 1.0
#   seed: ${seed}
#
# - Override a preset width:
#   preset: fg-sketch
#   num_features: 512
#   # For joint readout presets this is the TOTAL output dimension.
#   seed: ${seed}
#
# - Local full-gradient for atom-level selection:
#   preset: local_fg-sketch
#   seed: ${seed}
#
# DIRECT/BIRCH selection over global structure-level features:
# method: direct_birch
# selection_kwargs:
#   n_clusters: ${select_batch_size}
#   k: 1
#   threshold: 0.5
#   weighting_pcs: true
#   selection_criteria: center
target_layer: readout # External models may override this, e.g. MatGL -> final_layer, Allegro -> edge_readout, eSEN -> energy_block
num_layers: null # For segmented readouts: positive N selects the first N segments; -1 selects all segments; last selects the final segment
invariants_only: true # For segmented equivariant inputs, keep only invariant channels from each selected segment
save_features: null # H5 cache file path when set
save_selected_features: null # Selected feature file path when set
# Preserve the raw feature kernel for selection. Only enable the legacy /variance
# transform when explicitly reproducing historical geometry (no train_set).
legacy_variance_normalization: false
export_normalized_features: false # Deprecated alias of the legacy option; also affects SELECTION.
save_images: false
compute_features_only: false
target_domain: null
transforms: []
