_target_: curator.model.Painn                 # PAINN equivariant message passing network
num_interactions: 3                          # number of message passing layers
num_features: 128                            # hidden feature size
cutoff: 5.0                                  # interaction cutoff radius
num_basis: 20                                # radial basis size
cutoff_fn:
  _target_: curator.layer.CosineCutoff       # smooth cutoff envelope
  cutoff: ${..cutoff}                        # cutoff value shared with model
radial_basis:
  _target_: curator.layer.SineBasis          # radial basis expansion
  cutoff: ${..cutoff}                        # maximum radius for basis
  num_basis: ${model.representation.num_basis}  # number of basis functions
