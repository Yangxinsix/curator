_target_: curator.model.MACE     # MACE equivariant architecture
cutoff: 5.0                      # interaction cutoff radius
num_interactions: 3              # number of interaction blocks
num_elements: null               # number of species; inferred from `species` when null
species: ${data.species}         # species list passed to model
correlation: 3                   # body order / correlation order
hidden_irreps: null              # hidden irreps specification (auto if null)
MLP_irreps: null                 # MLP irreps specification
avg_num_neighbors: null          # average neighbors used for normalization
lmax: 3                          # maximum spherical harmonic order
parity: True                     # include parity equivariance
num_features: 32                 # embedding width (derived from hidden_irreps if null)
num_basis: 8                     # radial basis size
power: 6                         # cutoff envelope exponent
gate: silu                       # gating nonlinearity
