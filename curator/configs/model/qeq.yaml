defaults:
  - representation: painn                           # equivariant backbone for charge equilibration
_convert_: all                                      # instantiate nested objects eagerly
_target_: curator.model.NeuralNetworkPotential      # charge-aware potential wrapper

representation:
  readout:
    _target_: curator.layer.AtomwiseNN              # MLP readout over atom embeddings
    in_features: ${..num_features}                  # embedding size from representation
    out_features: 2                                 # predict energy and atomic charge
    heads:
    - energy                                        # total energy prediction
    - key: atomic_charge                            # per-atom charge output
      reduction: null                               # keep atomwise values
      write_atomwise: false
input_modules:
  - _target_: curator.layer.PairwiseDistance        # build pairwise distance graph
    compute_neighbor_list: True                     # build neighbor list when dataset does not provide one
    compute_distance_from_R: True                   # compute distances from positions
    cutoff: ${data.cutoff}                          # use the data cutoff for neighbor finding
output_modules:
  - _target_: curator.layer.GradientOutput          # derive forces/stresses from energy
    grad_on_positions: True                         # backprop on atomic positions
    grad_on_edge_diff: False                        # skip edge-difference gradients
  - _target_: curator.layer.ChargeEquilibration     # run charge equilibration layer
    num_features: ${...representation.num_features} # feature size for charge update
  - _target_: curator.layer.GlobalRescaleShift      # rescale and shift outputs
