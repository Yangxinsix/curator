defaults:
  - calculator: default_calculator
  - _self_

_target_: curator.simulate.simulator.NEBSimulator

initial_image: null                # path to initial structure
final_image: null                  # path to final structure
num_images: 3                      # number of intermediate images
fmax: 0.05                         # NEB convergence threshold (eV/Å)
max_steps: 200                     # maximum optimizer steps
print_step: 10                     # logging interval
start_index: 0

optimizer:
  _target_: hydra.utils.get_class
  path: ase.optimize.fire.FIRE

interpolator: null                 # optional ASE interpolator
neb_kwargs:
  allow_shared_calculator: true    # reuse calculator across images
opt_kwargs: {}

logger:
  _target_: curator.simulate.callbacks.thermo.MDThermoLogger
  variables:
    - step
    - epot
  interval: ${simulator.print_step}
  header: true
