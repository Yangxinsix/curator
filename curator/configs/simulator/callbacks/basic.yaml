callbacks:
  - _target_: curator.simulate.callbacks.calc.CalculatorAssign  # attach calculator to atoms
    calculator: ${calculator}                                   # calculator identifier/path
    warmup: true                                                # run warmup step before MD
    require_forces: false                                       # skip force requirement check
  - _target_: curator.simulate.callbacks.thermo.MDThermoLogger  # log thermodynamic quantities
    variables: basic_energies                                   # variables to record
    interval: 1                                                 # logging interval in steps
