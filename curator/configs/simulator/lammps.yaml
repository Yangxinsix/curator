defaults:
  - engine: lammps
  - _self_

_target_: curator.simulate.core.simulator.Simulator    # generic simulator orchestrator
init_traj: null                                        # initial structure or trajectory path
start_index: null                                      # frame index to start from
callbacks: []                                          # LAMMPS backend is artifact-driven, not callback-driven
run_kwargs:
  steps: 100                                           # number of LAMMPS steps to run
