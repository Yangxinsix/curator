_target_: curator.simulate.engines.torchsim.TorchSimEngine

# CURATOR → TorchSim adapter
model:
  _target_: curator.interface.torchsim.CuratorTorchSimAdapter
  model: ${model_path}            # checkpoint or compiled model path
  cutoff: null                    # infer from model if available
  compute_neighbor_list: true
  transforms: null
  device: ${device}
  load_compiled: false            # test checkpoint is a training ckpt
  load_weights_only: false
  return_cell_displacements: false
  outputs: null
  energy_scale: 1.0
  forces_scale: 1.0
  stress_scale: 1.0
  detach: true

# TorchSim integration settings
integrator: nve
temperature: 300.0
timestep: 0.001
integrator_kwargs: {}
