method: md              # simulation mode identifier
init_traj: null         # path to initial trajectory/structure
start_index: 0          # starting frame index
rattle: null            # optional initial random displacement amplitude
fix_under: null         # minimum coordination enforcement
friction: 0.003         # Langevin friction coefficient
temperature: 300 #K     # target temperature in Kelvin
time_step: 1.0 #fs      # integrator timestep in femtoseconds
print_step: 10          # logging interval
dump_step: 100          # trajectory writing interval
min_steps: 1000         # minimum steps before adaptive stopping
max_steps: 10000        # maximum allowed simulation steps
num_uncertain: 100      # limit of uncertain structures to collect
plumed_restart: False   # resume PLUMED metadynamics if True
