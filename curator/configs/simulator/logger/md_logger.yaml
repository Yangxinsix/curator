_target_: curator.simulate.logger.MDLogger          # general-purpose MD logger with uncertainty
variables: full_thermodynamics                      # variables to record
interval: ${simulator.print_step}                   # logging interval in steps
header: true                                        # print header row
monitor: mahalanobis_distance                       # uncertainty metric to monitor
low: 0.05                                           # lower threshold for saving frames
high: 0.5                                           # upper threshold for saving frames
save_path: ${run_path}/warning_struct.traj          # file path for uncertain structures
uncertain_count: null                               # stop after collecting this many uncertain frames
