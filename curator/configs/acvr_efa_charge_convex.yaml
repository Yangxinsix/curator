# Opt-in fine-tuning from a plain, trained geometry EFA checkpoint.
defaults:
  - acvr_efa_charge
  - _self_

run_path: runs/acvr_efa_charge_convex
model_path:
  transform:
    - type: efa_convex_charge
      residual_gradient_policy: joint
      batch_observables: true
      energy_options:
        curvature_floor: 0.01
        hardness_init: 0.1
task:
  outputs:
    - _target_: curator.train.VariationalModelOutput
      loss_fn:
        _target_: curator.train.VariationalJointLoss
        supervised_weights: {condition_energy: 200.0, condition_forces: 200.0}
        supervised_scales: {condition_energy: 1.0, condition_forces: 1.0}
        required_labels: [condition_energy, condition_forces]
        energy_per_atom: true
        residual_weights: {stationarity: 30.0}
