_target_: curator.train.ModelOutput
name: energy
loss_fn:
  _target_: torch.nn.MSELoss
loss_weight: ${oc.select:task.loss_weights.energy,1.0}
per_atom_loss: ${task.energy_per_atom_loss}
metrics:
  mae:
    _target_: curator.train.PerAtomMAE
    size_key: n_atoms
    value_key: ${...name}  # relative interpolation
  rmse:
    _target_: curator.train.PerAtomRMSE
    size_key: n_atoms
    value_key: ${...name}
