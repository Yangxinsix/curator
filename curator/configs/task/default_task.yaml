defaults:
  - optimizer: adam                  # optimizer used for training
  - scheduler: reduce_on_plateau     # LR scheduler policy
  - outputs: energy_force            # which model outputs and losses to train
  - optional distill: null           # optional offline teacher-label generation

_target_: curator.model.LitNNP       # LightningModule wrapper around the model
scheduler_monitor: val_total_loss    # metric monitored by the scheduler
warmup_steps: 0                      # optional linear warmup steps for optimizer
save_entire_model: True              # save full model object (not just state dict)
optimizer_groups: null               # optional per-group optimizer overrides, e.g. backbone/readout/output_modules
normalize_domain_loss: null          # auto-enable for multi-domain training when unset; set false to disable explicitly

# optional task-side loss overrides keyed by output name, e.g. {energy: 2, forces: 98}
loss_weights: {}
energy_per_atom_loss: true            # match MACE: compute energy MSE from (E_pred - E_ref) / n_atoms
patience: 200                        # early stopping patience (epochs)
