_target_: curator.data.AtomsDataModule   # data module driving loaders and splits
_convert_: partial                       # allow partial instantiation for hydra
datapath: null                           # single dataset path containing all splits
train_path: null                         # explicit training data path (overrides datapath)
val_path: null                           # explicit validation data path
test_path: null                          # explicit test data path
batch_size: 8                            # training batch size
compute_neighbor_list: True              # precompute neighbor lists with the native backend during loading
cutoff: 5.0                              # cutoff radius used for neighbor finding
num_train: 0.9                           # fraction or count of samples for training split
num_val: 0.1                             # fraction or count of samples for validation split
num_test: null                           # fraction or count for test split (null derives remainder)
train_val_split: random                  # random or sequential split strategy
shuffle: true                            # shuffle training data per epoch
num_workers: 0                           # DataLoader worker count
pin_memory: True                         # pin host memory for faster GPU transfer
species: null                            # list of chemical species; null infers from data
avg_num_neighbors: auto                  # average neighbors used for model normalization
atomic_energies: null                    # per-species reference energies for offsetting
normalization: True                      # enable global normalization of targets
atomwise_normalization: True             # normalize atomwise properties independently
scale_forces: True                       # use forces RMS as the energy scaling statistic
heads: [energy]                          # main readout heads
rescale_shift_heads: []                  # extra properties handled by the rescale/shift module in addition to energy
transforms: []                           # optional transforms applied to each structure
  # - _target_: curator.data.TypeMapper
  #   species: ${data.species}
