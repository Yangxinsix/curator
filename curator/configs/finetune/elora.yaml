# @package _global_

# ELoRA fine-tuning mode:
# - keep the base checkpoint frozen where wrappers expose LoRA adapters
# - optimize only the aggregated `elora` parameter group by default
task:
  checkpoint_mode: weights
  optimizer:
    lr: 0.0
  optimizer_groups:
    _delete_: true
    elora:
      lr: 5.0e-4
      weight_decay: 0.0
