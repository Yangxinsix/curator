# @package _global_

# Head-only fine-tuning mode:
# - set `model_path.mode: weights` when you want checkpoint weight loading
# - freeze non-readout groups by setting the base optimizer lr to zero
# - keep the representation readout trainable via an explicit group override
finetune: head_only

task:
  optimizer:
    lr: 0.0
  optimizer_groups:
    readout:
      lr: 5.0e-4
      weight_decay: 0.0
