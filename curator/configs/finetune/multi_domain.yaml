# @package _global_
defaults:
  - override /data: multi_domain
  - _self_

# Multi-domain fine-tuning mode:
# - load the checkpoint's native Curator model first
# - convert single-domain models to multi-domain explicitly at runtime
# - extend/replace domains from template domain "0"
# - prioritize domain-specific readout optimization
finetune: multi_domain

task:
  checkpoint_mode: model
  domain_mode: extend
  new_domains: null
  init_new_domains_from: "0"
  normalize_domain_loss: true
  optimizer_groups:
    readout_domains:
      lr: 5.0e-4

trainer:
  callbacks:
    freeze_schedule:
      _target_: curator.train.FreezeSchedule
      stages:
        - start_epoch: 0
          lr:
            readout_domains: 5.0e-4
        - start_epoch: 10
          lr:
            readout_domains: 1.0e-4
