# @package _global_

# LoRA fine-tuning mode:
# - enable the LoRA wrapper on supported modules
# - rely on each LoRA-wrapped module to freeze its own base weights when
#   `lora_freeze_base=true`
# - do not globally zero the learning rate for non-adapter parameter groups;
#   unwrapped modules keep their normal optimizer settings
# - set `model_path.mode: weights` when you want checkpoint weight loading
finetune: lora
wrapper:
  adapter: lora
  lora_rank: 16
  lora_alpha: 16.0
  lora_freeze_base: true

task:
  optimizer_groups:
    adapter:
      lr: ${task.optimizer.lr}   # default: inherit the main optimizer lr; override here to tune LoRA separately
      weight_decay: 0.0
