run_path: .                             # working directory for outputs
cfg: null                               # optional config file to load
model_path: null                        # checkpoint or deployable model path
datapath: null                          # dataset to evaluate on
deploy: null                            # deployment config or compiled model path
device: cuda                            # device for evaluation

evaluator:
  _target_: curator.evaluate.evaluator.Evaluator  # evaluation driver
  data_reader:
    _target_: curator.data.AseDataReader          # reader for ASE-formatted data
    _partial_: True                               # instantiate lazily
    compute_neighbor_list: True                   # build neighbor lists during read
    transforms: []                                # optional preprocessing transforms
  save_data: False                                # persist processed dataset to disk
  plot_figure: True                               # generate evaluation plots
