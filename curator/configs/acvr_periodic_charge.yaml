# Numerical 3D-periodic charge benchmark; not DFT electrode reference data.
# Change only proposal.communication to pointwise/mp/attention/ewald for an arm.
# The intrinsic Ewald energy and all boundary inputs stay identical.
seed: 17
cfg: null
run_path: runs/acvr_periodic_charge/ewald
model_path: null
device: cpu
compile: false
deploy_model: false
finetune: full

data:
  _target_: curator.data.periodic_charge_oracle.PeriodicChargeOracleDataModule
  batch_size: 4
  num_train: 128
  num_val: 32
  num_test: 64
  plane_side: 4
  spacing: 2.8
  cell_height: 16.0
  jitter: 0.08
  cutoff: 3.5
  charge_extent: 0.5
  potential_extent: 1.0
  local_drive: 0.1
  ewald_alpha: 0.4
  ewald_accuracy: 8.0
  seed: ${seed}

model:
  _target_: curator.model.NeuralNetworkPotential
  representation:
    _target_: curator.model.Painn
    num_interactions: 3
    num_features: 48
    num_basis: 8
    cutoff: ${data.cutoff}
  input_modules:
    - _target_: curator.layer.PairwiseDistance
      compute_distance_from_R: true
      compute_forces: false
  output_modules:
    - _target_: curator.layer.VariationalEnergyOutput
      state_kind: scalar
      components: 1
      state_unit: e
      conjugate_unit: V
      hidden_features: 48
      residual_scale: 1.0
      compute_forces: false
      state_mode: predicted
      compute_responses: false
      retain_response_graph: true
      internal_energy:
        _target_: curator.layer.EwaldChargeEnergy
        hidden_features: 48
        hardness_floor: 20.0
        ewald:
          _target_: curator.layer.EwaldSummation
          alpha: ${data.ewald_alpha}
          acc_factor: ${data.ewald_accuracy}
      proposal:
        _target_: curator.layer.BoundaryConditionedProposal
        communication: ewald
        hidden_features: 48
        num_layers: 2
        num_heads: 4
        state_scale: 0.05
        field_scale: 1.0
      observables:
        - _target_: curator.variational.observables.ObservableSpec
          name: control_derivative
          derivatives: [control_value]
          unit: e
        - _target_: curator.variational.observables.ObservableSpec
          name: constraint_derivative
          derivatives: [constraint_target]
          unit: V
  model_outputs: [variational_prediction]

task:
  _target_: curator.model.LitNNP
  outputs:
    - _target_: curator.train.VariationalModelOutput
      loss_fn:
        _target_: curator.train.VariationalJointLoss
        supervised_weights:
          condition_energy: 1.0
          control_derivative: 1.0
          constraint_derivative: 1.0
        # Explicit unit scales for the runnable reference config. Experiment
        # runners may replace these with frozen TRAIN-only component RMS values.
        supervised_scales:
          condition_energy: 1.0
          control_derivative: 1.0
          constraint_derivative: 1.0
        required_labels: [condition_energy, control_derivative, constraint_derivative]
        residual_weights: {stationarity: 0.1}
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
  scheduler: null
  save_entire_model: true
  normalize_domain_loss: false

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: cpu
  devices: 1
  precision: 64-true
  max_epochs: 20
  max_steps: 2000
  inference_mode: false
  deterministic: true
  gradient_clip_val: 10.0
  enable_model_summary: false
  enable_progress_bar: false
  num_sanity_val_steps: 2
  log_every_n_steps: 4
  default_root_dir: ${run_path}
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${run_path}
    name: metrics
  callbacks:
    - _target_: curator.train.joint_callbacks.JointValidationLoss
    - _target_: curator.train.joint_callbacks.JointModelCheckpoint
      dirpath: ${run_path}/model_path
      filename: best_model_{epoch}_{step}_{val_joint_predicted_loss:.8f}
      monitor: val_joint_predicted_loss
      mode: min
      save_top_k: 1
      save_last: true
      every_n_epochs: 1
      save_on_train_epoch_end: true

hydra:
  run:
    dir: ${run_path}/hydra
