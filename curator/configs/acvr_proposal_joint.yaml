# Small nonperiodic oracle for proposal integration and derivative smoke tests.
seed: 4
cfg: null
run_path: runs/acvr_proposal_joint/pointwise
model_path: null
device: cpu
compile: false
deploy_model: false
finetune: full
data:
  _target_: curator.data.variational_oracle.VariationalOracleDataModule
  batch_size: 8
  num_train: 64
  num_val: 16
  num_test: 16
  num_conditions: 3
  seed: 17
model:
  _target_: curator.model.NeuralNetworkPotential
  representation:
    _target_: curator.model.Painn
    num_interactions: 2
    num_features: 24
    num_basis: 8
    cutoff: 4.0
  input_modules:
  - _target_: curator.layer.PairwiseDistance
    compute_neighbor_list: true
    compute_distance_from_R: true
    compute_forces: true
    cutoff: 4.0
  output_modules:
  - _target_: curator.layer.VariationalEnergyOutput
    state_kind: scalar
    components: 2
    hidden_features: 24
    residual_scale: 1.0
    compute_forces: true
    state_mode: predicted
    compute_responses: false
    retain_response_graph: false
    proposal:
      _target_: curator.layer.BoundaryConditionedProposal
      communication: pointwise
      hidden_features: 48
      num_layers: 2
      num_heads: 4
  model_outputs:
  - variational_prediction
task:
  _target_: curator.model.LitNNP
  outputs:
  - _target_: curator.train.VariationalModelOutput
    loss_fn:
      _target_: curator.train.VariationalJointLoss
      supervised_weights:
        condition_energy: 1.0
        condition_forces: 1.0
        variable_value: 1.0
      supervised_scales:
        condition_energy: 1.0
        condition_forces: 1.0
        variable_value: 1.0
      required_labels:
      - condition_energy
      - condition_forces
      - variable_value
      residual_weights:
        stationarity: 0.1
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
  scheduler: null
  save_entire_model: true
  normalize_domain_loss: false
trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: cpu
  devices: 1
  precision: 64-true
  max_epochs: 20
  inference_mode: false
  deterministic: true
  gradient_clip_val: 10.0
  accumulate_grad_batches: 1
  enable_model_summary: false
  enable_progress_bar: false
  num_sanity_val_steps: 2
  log_every_n_steps: 4
  default_root_dir: ${run_path}
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${run_path}
    name: metrics
  callbacks:
  - _target_: curator.train.joint_callbacks.JointValidationLoss
  - _target_: curator.train.joint_callbacks.JointModelCheckpoint
    dirpath: ${run_path}/model_path
    filename: best_model_{epoch}_{step}_{val_joint_predicted_loss:.8f}
    monitor: val_joint_predicted_loss
    mode: min
    save_top_k: 1
    save_last: true
    every_n_epochs: 1
    save_on_train_epoch_end: true
  max_steps: 2000
hydra:
  run:
    dir: ${run_path}/hydra
