energy_weight: 1
forces_weight: 100
load_entire_model: false
load_weights_only: true
optimizer: !!python/object/apply:functools.partial
  args:
  - &id001 !!python/name:torch.optim.adamw.AdamW ''
  state: !!python/tuple
  - *id001
  - !!python/tuple []
  - amsgrad: true
    betas: &id002 !!python/object:omegaconf.listconfig.ListConfig
      _content:
      - !!python/object:omegaconf.nodes.AnyNode
        _metadata: !!python/object:omegaconf.base.Metadata
          flags: {}
          flags_root: false
          key: 0
          object_type: null
          optional: true
          ref_type: &id003 !!python/name:typing.Any ''
          resolver_cache: !!python/object/apply:collections.defaultdict
          - &id004 !!python/name:builtins.dict ''
        _parent: *id002
        _val: 0.9
      - !!python/object:omegaconf.nodes.AnyNode
        _metadata: !!python/object:omegaconf.base.Metadata
          flags: {}
          flags_root: false
          key: 1
          object_type: null
          optional: true
          ref_type: *id003
          resolver_cache: !!python/object/apply:collections.defaultdict
          - *id004
        _parent: *id002
        _val: 0.999
      _metadata: !!python/object:omegaconf.base.ContainerMetadata
        element_type: *id003
        flags:
          allow_objects: true
        flags_root: false
        key: null
        key_type: !!python/name:builtins.int ''
        object_type: !!python/name:builtins.list ''
        optional: true
        ref_type: *id003
        resolver_cache: !!python/object/apply:collections.defaultdict
        - *id004
      _parent: null
    eps: 1.0e-08
    lr: 0.005
    weight_decay: 0.0
  - null
patience: 200
save_entire_model: true
scheduler: !!python/object/apply:functools.partial
  args:
  - &id005 !!python/name:torch.optim.lr_scheduler.ReduceLROnPlateau ''
  state: !!python/tuple
  - *id005
  - !!python/tuple []
  - factor: 0.5
    patience: 50
  - null
scheduler_monitor: val_total_loss
warmup_steps: 0
